<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RaceOS Birthday</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: linear-gradient(135deg, #050505, #111827);
            font-family: Arial, sans-serif;

            color: lime;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            overflow: hidden;
        }

        .container {

            width: 700px;
            max-width: 90%;

            background: rgba(0,0,0,0.9);

            border: 3px solid lime;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            box-shadow: 0 0 30px lime;

        }

        h1 {

            margin-bottom: 20px;

            font-size: 40px;

            text-shadow: 0 0 10px lime;

        }

        #stage {

            margin-bottom: 20px;

            color: orange;

            font-size: 18px;

        }

        #question {

            font-size: 28px;

            line-height: 1.5;

            margin-bottom: 30px;

        }

        input {

            width: 70%;

            padding: 15px;

            font-size: 20px;

            background: black;

            color: lime;

            border: 2px solid lime;

            border-radius: 10px;

            text-align: center;

        }

        button {

            margin-top: 20px;

            padding: 15px 30px;

            font-size: 20px;

            border: none;

            background: lime;

            color: black;

            font-weight: bold;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.2s;

        }

        button:hover {

            transform: scale(1.05);

            box-shadow: 0 0 20px lime;

        }

        #result {

            margin-top: 20px;

            font-size: 22px;

            height: 40px;

        }

        .glitch {

            animation: glitch 0.2s infinite;

        }

        @keyframes glitch {

            0% {
                transform: translate(2px, 0);
            }

            25% {
                transform: translate(-2px, 2px);
            }

            50% {
                transform: translate(2px, -2px);
            }

            75% {
                transform: translate(-2px, 0);
            }

            100% {
                transform: translate(0, 0);
            }

        }

        .gift {

            margin-top: 30px;

            animation: bounce 1s infinite;

        }

        .gift img {

            width: 250px;

            border-radius: 20px;

            border: 3px solid lime;

            box-shadow: 0 0 20px lime;

        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }

        .confetti {

            position: fixed;

            width: 10px;
            height: 10px;

            background: red;

            top: -20px;

            animation: fall linear forwards;

        }

        @keyframes fall {

            to {

                transform: translateY(110vh) rotate(720deg);

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>RACE OS</h1>

        <div id="stage">
            Stage 1 / 2
        </div>

        <div id="question">

            Je mehr ich laufe,<br>
            desto heißer werde ich.<br>
            Ohne mich geht kein Auto.<br>
            Was bin ich?

        </div>

        <br>

        <input type="text" id="answer" placeholder="Antwort eingeben...">

        <br>

        <button onclick="checkAnswer()">
            ACCESS SYSTEM
        </button>

        <div id="result"></div>

        <div id="giftArea"></div>

    </div>

    <script>

        // ---------- SOUNDS ----------

        let startupSound = new Audio("sounds/Engine.mp3");
        let glitchSound = new Audio("sounds/glitch.mp3");
        let successSound = new Audio("sounds/success.mp3");
        let errorSound = new Audio("sounds/error.mp3");

        // ---------- VARIABLES ----------

        let stage = 1;

        // ---------- ENTER KEY ----------

        document.getElementById("answer")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    checkAnswer();

                }

            });

        // ---------- MAIN FUNCTION ----------

        function checkAnswer() {

            let answer = document
                .getElementById("answer")
                .value
                .toLowerCase()
                .trim();

            let question = document.getElementById("question");
            let result = document.getElementById("result");
            let stageText = document.getElementById("stage");
            let giftArea = document.getElementById("giftArea");

            // ---------- STAGE 1 ----------

            if (stage === 1) {

                if (
                    answer === "motor" ||
                    answer === "engine"
                ) {

                    successSound.play();

                    result.style.color = "lime";

                    result.innerText =
                        "ENGINE ACCESS GRANTED";

                    question.innerHTML =

                        "Je stärker ich aufdrehe,<br>" +
                        "desto schneller drehe ich mich,<br>" +
                        "und doch komme ich nie voran.<br>" +
                        "Was bin ich?";

                    stage = 2;

                    stageText.innerText =
                        "Stage 2 / 2";

                }

                else {

                    wrongAnswer(question, result);

                }

            }

            // ---------- STAGE 2 ----------

            else if (stage === 2) {

                if (

                    answer === "rad" ||
                    answer === "reifen" ||
                    answer === "wheel"

                ) {

                    successSound.play();

                    result.style.color = "lime";

                    result.innerText =
                        "GARAGE UNLOCKED";

                    question.innerHTML =

                        "🎉 ALLES GUTE ZUM GEBURTSTAG 🎉<br><br>" +
                        "Du hast das Geschenk freigeschaltet!";

                    document.getElementById("answer")
                        .style.display = "none";

                    document.querySelector("button")
                        .style.display = "none";

                    giftArea.innerHTML =

                        '<div class="gift">' +

                        '<img src="gift.png">' +

                        '</div>';

                    createConfetti();

                    stage = 3;

                }

                else {

                    wrongAnswer(question, result);

                }

            }

            if (stage !== 3) {

                document.getElementById("answer").value = "";

            }

        }

        // ---------- WRONG ANSWER ----------

        function wrongAnswer(question, result) {

            glitchSound.play();
            errorSound.play();

            result.style.color = "red";

            result.innerText =
                "ACCESS DENIED";

            question.classList.add("glitch");

            setTimeout(() => {

                question.classList.remove("glitch");

                result.innerText = "";

            }, 1000);

        }

        // ---------- CONFETTI ----------

        function createConfetti() {

            for (let i = 0; i < 100; i++) {

                let confetti =
                    document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.background =
                    `hsl(${Math.random() * 360},100%,50%)`;

                confetti.style.animationDuration =
                    2 + Math.random() * 3 + "s";

                document.body.appendChild(confetti);

                setTimeout(() => {

                    confetti.remove();

                }, 5000);

            }

        }

    </script>

</body>

</html>
