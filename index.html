<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geburtstagsgeschenk 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 100%);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid #ff6b6b;
        }
        
        h1 {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255,107,107,0.5);
        }
        
        .question-box {
            background: #0a0a0f;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #ff6b6b;
        }
        
        #question {
            color: #00ff9d;
            font-size: 1.5em;
            line-height: 1.5;
            text-align: center;
            transition: all 0.3s;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #answer {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            background: #0a0a0f;
            border: 2px solid #ff6b6b;
            color: #00ff9d;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
        }
        
        #answer:focus {
            outline: none;
            border-color: #00ff9d;
            box-shadow: 0 0 10px rgba(0,255,157,0.3);
        }
        
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        button:hover {
            background: #ff4757;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,107,107,0.5);
        }
        
        #result {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 20px;
        }
        
        .glitch {
            animation: glitch 0.3s ease-in-out;
        }
        
        @keyframes glitch {
            0% { transform: translateX(0); opacity: 1; }
            25% { transform: translateX(-5px); opacity: 0.8; }
            50% { transform: translateX(5px); opacity: 0.9; }
            75% { transform: translateX(-3px); opacity: 0.8; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        .gift-box {
            text-align: center;
            margin-top: 30px;
            font-size: 3em;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: confetti-fall 5s linear infinite;
            pointer-events: none;
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        .celebrate {
            animation: celebrate 0.5s ease;
        }
        
        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        #birthdayMessage {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            color: #ffd166;
        }
        
        .stage-indicator {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🔧 Rätsel, damit du nicht komplett abkackst 🔧</h1>
        
        <div class="stage-indicator" id="stageIndicator">
            🎯 Stage 1/2
        </div>
        
        <div class="question-box">
            <div id="question">
                Je mehr ich laufe, desto heißer werde ich.<br>
                Ohne mich geht kein Auto.<br>
                Was bin ich?
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="answer" placeholder="Deine Antwort..." autocomplete="off">
            <button onclick="checkAnswer()">⏎ Prüfen</button>
        </div>
        
        <div id="result"></div>
        <div id="birthdayMessage"></div>
    </div>

    <script>
        // Sound setup
        let startupSound = new Audio("sounds/Engine.mp3");
        let glitchSound = new Audio("sounds/glitch.mp3");
        let successSound = new Audio("sounds/success.mp3");
        let errorSound = new Audio("sounds/error.mp3");
        
        // Preload sounds
        startupSound.load();
        glitchSound.load();
        successSound.load();
        errorSound.load();
        
        // Play startup sound when page loads
        window.addEventListener('load', () => {
            startupSound.play().catch(e => console.log('Audio play prevented:', e));
        });
        
        let stage = 1;
        const stageIndicator = document.getElementById('stageIndicator');
        
        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff6b6b', '#00ff9d', '#ffd166', '#6b5bff', '#ff9d00'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        function checkAnswer() {
            const answerInput = document.getElementById("answer");
            const answer = answerInput.value.toLowerCase().trim();
            const question = document.getElementById("question");
            const result = document.getElementById("result");
            const birthdayMessage = document.getElementById("birthdayMessage");
            
            // ---------- RIDDLE 1 ----------
            if (stage === 1) {
                // Answer for first riddle: "motor" or "engine"
                if (answer === "motor" || answer === "engine" || answer === "auto") {
                    successSound.play();
                    result.style.color = "#00ff9d";
                    result.innerText = "✅ ENGINE ACCESS GRANTED! ✅";
                    
                    // Update question to second riddle
                    question.innerHTML =
                        "Je stärker ich aufdrehe,<br>" +
                        "desto schneller drehe ich mich,<br>" +
                        "und doch komme ich nie voran.<br>" +
                        "Was bin ich?";
                    
                    answerInput.value = "";
                    stage = 2;
                    stageIndicator.innerHTML = "🎯 Stage 2/2";
                    stageIndicator.style.color = "#ffd166";
                    
                    // Clear message after 2 seconds
                    setTimeout(() => {
                        result.innerText = "";
                    }, 2000);
                    
                } else {
                    glitchSound.play();
                    errorSound.play();
                    result.style.color = "#ff6b6b";
                    result.innerText = "❌ ACCESS DENIED! ❌";
                    
                    question.classList.add("glitch");
                    
                    setTimeout(() => {
                        question.classList.remove("glitch");
                        result.innerText = "";
                    }, 1000);
                }
            }
            
            // ---------- RIDDLE 2 ----------
            // Show birthday message with celebration
question.innerHTML =
    "🎉🎂 HERZLICHEN GLÜCKWUNSCH! 🎂🎉<br><br>" +
    "Du hast die Rätsel gelöst!<br>" +
    "Hier ist dein Geschenk! 🎁";

// Hide input and button
document.querySelector(".input-area").style.display = "none";

// Add gift box animation AND your QR code
birthdayMessage.innerHTML = `
    <div class="gift-box">
        🎁🎈🎊
    </div>
    <div style="margin-top: 20px; font-size: 1.3em;">
        Alles Gute zum Geburtstag! 🎂
    </div>
    <div style="margin-top: 30px;">
        <img src="qrcode (5).png" alt="Your Gift" style="width: 200px; border-radius: 10px; border: 3px solid #ff6b6b; box-shadow: 0 0 20px rgba(255,107,107,0.5);">
    </div>
`;
                    
                    // Create massive confetti celebration
                    createConfetti();
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            createConfetti();
                        }, i * 1000);
                    }
                    
                    // Add celebration animation to container
                    document.querySelector('.game-container').classList.add('celebrate');
                    
                    // Play sound multiple times for celebration
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            successSound.play();
                        }, i * 500);
                    }
                    
                    stage = 3; // Game completed
                    
                } else {
                    glitchSound.play();
                    errorSound.play();
                    result.style.color = "#ff6b6b";
                    result.innerText = "❌ WRONG ANSWER! Try again! ❌";
                    
                    question.classList.add("glitch");
                    
                    setTimeout(() => {
                        question.classList.remove("glitch");
                        result.innerText = "";
                    }, 1000);
                }
            }
            
            // Clear input after each attempt (if not stage 3)
            if (stage !== 3) {
                answerInput.value = "";
            }
        }
        
        // Allow pressing Enter key to submit
        document.getElementById("answer").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });
        
        // Optional: Add hint system
        let hintsGiven = false;
        document.addEventListener('keydown', function(event) {
            if (event.key === 'h' && !hintsGiven && stage < 3) {
                const hint = document.createElement('div');
                hint.style.color = '#ffd166';
                hint.style.fontSize = '0.9em';
                hint.style.marginTop = '10px';
                hint.style.textAlign = 'center';
                
                if (stage === 1) {
                    hint.innerText = '💡 Hint: It\'s the heart of the car... think German!';
                } else if (stage === 2) {
                    hint.innerText = '💡 Hint: Round and round it goes, but never leaves the car!';
                }
                
                document.querySelector('.question-box').appendChild(hint);
                hintsGiven = true;
                
                setTimeout(() => {
                    hint.remove();
                }, 5000);
            }
        });
    </script>
</body>
</html>
